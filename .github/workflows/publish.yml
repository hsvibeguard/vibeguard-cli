# Publish vibeguard-cli to PyPI on version tags (v*.*.*).
#
# ACTIVATION REQUIRED (one-time): PyPI trusted publishing is configured
# per-repository. Before this works from hsvibeguard/vibeguard-cli, add a
# Trusted Publisher on PyPI:
#   PyPI -> vibeguard-cli -> Manage -> Publishing -> Add a new publisher:
#     Owner: hsvibeguard | Repository: vibeguard-cli
#     Workflow: publish.yml | Environment: pypi
# Until then, keep publishing from your existing pipeline. The tag trigger is
# disabled below so the first public release won't attempt a duplicate PyPI
# upload; run it manually (workflow_dispatch) once trusted publishing is on.

name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Verify
        run: |
          python -m pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/vibeguard-cli/
    permissions:
      id-token: write   # OIDC trusted publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Extract version
        id: v
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        with:
          name: VibeGuard v${{ steps.v.outputs.version }}
          generate_release_notes: true
          files: dist/*
