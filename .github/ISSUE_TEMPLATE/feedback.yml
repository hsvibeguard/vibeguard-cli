name: Feedback / I tried it
description: Tried VibeGuard? Tell us what was confusing or useful - brutal feedback welcome.
labels: ["feedback"]
body:
  - type: textarea
    id: tried
    attributes:
      label: What did you scan, and how did it go?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: What was confusing or annoying?
  - type: textarea
    id: wish
    attributes:
      label: One thing you wish it did
